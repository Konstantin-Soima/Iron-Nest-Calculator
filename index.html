<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1714">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IRON NEST</title>
<style>
  :root{
    --bg:#1a1714; --panel:#242019; --key:#2c2721; --edge:#3d352a;
    --brass:#c8a24a; --brass-dim:#8a7132;
    --ink:#e8dcc0; --dim:#9a8d74; --bad:#a8442e;
  }
  /* touch-action не наследуется — гасим двойной тап на КАЖДОМ элементе */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
  html,body{height:100%; overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100%}
  body{
    margin:0; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:"Courier New",Courier,monospace;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    height:100vh; height:100dvh;
    padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px);
    max-width:520px; margin:0 auto;
    display:flex; flex-direction:column; gap:8px;
  }

  /* ---------- вывод ---------- */
  .readout{
    background:#0d0b08; border:1px solid var(--edge); border-radius:4px;
    padding:10px 12px 12px; text-align:center; flex:0 0 auto;
  }
  .rangeline{
    display:flex; align-items:baseline; justify-content:center; gap:8px;
    font-size:13px; letter-spacing:.14em; color:var(--dim); margin-bottom:2px;
  }
  #rangeVal{
    font-size:30px; font-weight:700; color:var(--ink); letter-spacing:.04em;
    border-bottom:2px solid var(--brass-dim); padding:0 6px; min-width:90px; display:inline-block;
  }
  #rangeVal.blink{border-bottom-color:var(--brass)}
  .big{
    font-size:clamp(46px,15vw,76px); font-weight:700; line-height:1.05; color:var(--brass);
    text-shadow:0 0 22px rgba(200,162,74,.25); letter-spacing:.01em; margin-top:2px;
  }
  .big .deg{font-size:.45em; color:var(--brass-dim)}
  .big.err{color:var(--bad); font-size:clamp(24px,8vw,38px); text-shadow:none}
  .note{font-size:11px; letter-spacing:.12em; color:var(--dim); min-height:14px; margin-top:4px}
  .note.warn{color:var(--bad)}

  /* ---------- заряды ---------- */
  .charges{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; flex:0 0 auto}
  .chg{
    background:var(--key); border:1px solid var(--edge); border-radius:4px;
    padding:8px 2px 6px; text-align:center; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .chg .n{font-size:19px; font-weight:700; color:var(--dim); line-height:1}
  .chg .e{font-size:10px; color:#6b5f4c; letter-spacing:.02em; line-height:1}
  .chg.sel{background:var(--brass); border-color:var(--brass)}
  .chg.sel .n{color:#12100c}
  .chg.sel .e{color:#3d3213}
  .chg.live .n{color:var(--ink)}
  .chg.live .e{color:var(--brass-dim)}
  .chg.dead{opacity:.3}
  .chg.bump{animation:bump .45s ease-out}
  @keyframes bump{
    0%{box-shadow:0 0 0 0 rgba(200,162,74,.9); transform:scale(1.1)}
    100%{box-shadow:0 0 0 14px rgba(200,162,74,0); transform:scale(1)}
  }

  /* ---------- клавиатура ---------- */
  .pad{
    flex:1 1 auto; min-height:0;
    display:grid; gap:6px;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(4,1fr) .62fr;
    grid-template-areas:
      "k1 k2 k3"
      "k4 k5 k6"
      "k7 k8 k9"
      "kd k0 kb"
      "kc kc kc";
  }
  .k{
    background:var(--key); border:1px solid var(--edge); border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(24px,7vw,34px); font-weight:700; color:var(--ink);
    cursor:pointer; transition:background .05s;
  }
  .k:active,.k.hit{background:var(--brass); color:#12100c; border-color:var(--brass)}
  .k.alt{color:var(--brass); font-size:clamp(20px,6vw,28px)}
  .k.clr{
    color:var(--bad); font-size:clamp(13px,3.6vw,16px); letter-spacing:.3em;
    border-color:#4a2c22; background:#241a16;
  }
  .k.clr:active,.k.clr.hit{background:var(--bad); color:#12100c; border-color:var(--bad)}

  .hint{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:10px; letter-spacing:.08em; color:#6b5f4c;
  }
  #lock{
    display:inline-flex; align-items:center; gap:5px; cursor:pointer;
    padding:4px 8px; border:1px solid var(--edge); border-radius:99px;
    letter-spacing:.14em; white-space:nowrap; color:var(--dim); background:var(--panel);
  }
  #lock .dot{width:7px; height:7px; border-radius:50%; background:#5a4f3e}
  #lock.on{color:#8fbf5c; border-color:#3f5230}
  #lock.on .dot{background:#8fbf5c; box-shadow:0 0 7px #8fbf5c}
  #lock.err{color:var(--bad); border-color:#4a2c22}
  #lock.err .dot{background:var(--bad)}
</style>
</head>
<body>
<div id="app">

  <div class="readout">
    <div class="rangeline">
      <span id="rangeVal">12.00</span><span>КМ</span>
    </div>
    <div class="big" id="out">48.00<span class="deg">°</span></div>
    <div class="note" id="note"></div>
  </div>

  <div class="charges" id="charges"></div>

  <div class="pad" id="pad"></div>

  <div class="hint">
    <span id="lock"><span class="dot"></span><span id="lockTxt">ЭКРАН</span></span>
    <span>угол = 12 × км / заряды&nbsp;·&nbsp;потолок 60°</span>
  </div>

</div>

<script>
(function(){
  var MAX_ELEV = 60, KM_PER_CHARGE = 5, K = 12;

  /* ---------- жёстко фиксируем масштаб (Safari игнорирует user-scalable) ---------- */
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){
    document.addEventListener(t, function(ev){ ev.preventDefault(); }, {passive:false});
  });
  document.addEventListener('dblclick', function(ev){ ev.preventDefault(); }, {passive:false});
  // добивка: два тапа подряд быстрее 350 мс — глушим второй
  var lastTap = 0;
  document.addEventListener('touchend', function(ev){
    var now = Date.now();
    if (now - lastTap < 350) ev.preventDefault();
    lastTap = now;
  }, {passive:false});

  var buf = "12.00";
  var charges = 3;

  var rangeValEl = document.getElementById('rangeVal');
  var outEl      = document.getElementById('out');
  var noteEl     = document.getElementById('note');
  var chgWrap    = document.getElementById('charges');
  var padEl      = document.getElementById('pad');

  /* ---------- заряды ---------- */
  for (var i=1;i<=6;i++){
    var d = document.createElement('div');
    d.className = 'chg';
    d.dataset.n = i;
    d.innerHTML = '<div class="n">'+i+'</div><div class="e">—</div>';
    chgWrap.appendChild(d);
  }
  chgWrap.addEventListener('pointerdown', function(ev){
    var el = ev.target.closest('.chg');
    if (!el) return;
    charges = +el.dataset.n;
    buzz(); render();
  });

  /* ---------- клавиатура ---------- */
  var keys = [
    ['1','k1'],['2','k2'],['3','k3'],
    ['4','k4'],['5','k5'],['6','k6'],
    ['7','k7'],['8','k8'],['9','k9'],
    ['.','kd'],['0','k0'],['⌫','kb'],
    ['СТЕРЕТЬ','kc']
  ];
  keys.forEach(function(pair){
    var k = pair[0], area = pair[1];
    var el = document.createElement('div');
    el.className = 'k' + (k === '.' || k === '⌫' ? ' alt' : '') + (area === 'kc' ? ' clr' : '');
    el.textContent = k;
    el.dataset.k = k;
    el.style.gridArea = area;
    padEl.appendChild(el);
  });

  padEl.addEventListener('pointerdown', function(ev){
    var el = ev.target.closest('.k');
    if (!el) return;
    press(el.dataset.k); buzz();
  });

  // физическая клавиатура — на случай десктопа
  window.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (/^[0-9]$/.test(k) || k === '.' || k === ',') { press(k === ',' ? '.' : k); flash(k); }
    else if (k === 'Backspace') { press('⌫'); flash('⌫'); }
    else if (k === 'Escape' || k === 'Delete') { press('СТЕРЕТЬ'); flash('СТЕРЕТЬ'); }
    else if (/^[1-6]$/.test(k) && ev.shiftKey) { charges = +k; render(); }
    else return;
    ev.preventDefault();
  });
  function flash(k){
    var el = padEl.querySelector('[data-k="'+k+'"]');
    if (!el) return;
    el.classList.add('hit');
    setTimeout(function(){ el.classList.remove('hit'); }, 90);
  }

  function press(k){
    if (k === 'СТЕРЕТЬ'){
      buf = "";
    } else if (k === '⌫'){
      buf = buf.slice(0,-1);
      if (buf.slice(-1) === '.') buf = buf.slice(0,-1);   // точку проскакиваем
    } else if (k === '.'){
      if (buf.indexOf('.') === -1) buf = (buf === "" ? "0" : buf) + '.';
    } else {
      var dot   = buf.indexOf('.');
      var dig   = buf.replace(/\D/g,'').length;
      var frac  = dot < 0 ? 0 : buf.length - dot - 1;

      // поле забито (4 цифры или 2 знака после точки) — начинаем ввод заново
      if (dig >= 4 || frac >= 2) buf = "";

      if (buf === "0") buf = "";
      buf += k;

      // две целых цифры — точка сама
      if (buf.indexOf('.') === -1 && buf.length === 2) buf += '.';
    }
    render();
  }

  function buzz(){ if (navigator.vibrate) navigator.vibrate(8); }

  function km(){ var v = parseFloat(buf); return isNaN(v) ? 0 : v; }
  function elev(d,c){ return K * d / c; }

  function render(){
    var d = km();

    rangeValEl.textContent = buf === "" ? "—" : buf;
    rangeValEl.classList.toggle('blink', buf !== "");

    // не хватает пороха на такую дальность — сами поднимаем заряд
    var bumped = false;
    if (d > 0 && elev(d, charges) > MAX_ELEV){
      var fit = Math.ceil(d / KM_PER_CHARGE);
      if (fit <= 6 && fit !== charges){ charges = fit; bumped = true; }
    }

    // кнопки зарядов + их углы
    [].forEach.call(chgWrap.children, function(el){
      var n = +el.dataset.n, e = elev(d,n), ok = d > 0 && e <= MAX_ELEV;
      el.className = 'chg' + (n === charges ? ' sel' : '') + (ok ? ' live' : (d > 0 ? ' dead' : ''));
      el.querySelector('.e').textContent = ok ? e.toFixed(2) : '—';
    });

    if (bumped){
      var sel = chgWrap.children[charges-1];
      sel.classList.remove('bump');
      void sel.offsetWidth;               // перезапуск анимации
      sel.classList.add('bump');
      buzz();
    }

    var e = elev(d, charges);
    if (d <= 0){
      outEl.className = 'big';
      outEl.innerHTML = '0.00<span class="deg">°</span>';
      noteEl.className = 'note';
      noteEl.textContent = '';
    } else if (e > MAX_ELEV){
      outEl.className = 'big err';
      outEl.textContent = 'НЕ ДОСТАЁТ';
      noteEl.className = 'note warn';
      noteEl.textContent = 'дальше 30 км не бьёт даже на 6 зарядах';
    } else {
      outEl.className = 'big';
      outEl.innerHTML = e.toFixed(2) + '<span class="deg">°</span>';
      noteEl.className = 'note';
      noteEl.textContent = (bumped ? '↑ заряд поднят до ' + charges + '  ·  ' : '') +
                           'предел ' + (charges*KM_PER_CHARGE) + ' км  ·  ' +
                           (e >= 45 ? 'навесная' : e >= 25 ? 'средняя' : 'настильная');
    }
  }

  render();

  /* ---------- не давать экрану гаснуть ---------- */
  var lockEl = document.getElementById('lock');
  var lockTxt = document.getElementById('lockTxt');
  var wl = null, vid = null, want = true, mode = '';

  function status(){
    var live = !!wl || !!vid;
    lockEl.className = !want ? '' : (live ? 'on' : 'err');
    lockTxt.textContent = !want ? 'ЭКРАН ГАСНЕТ'
                        : live ? (mode === 'wl' ? 'ЭКРАН ГОРИТ' : 'ЭКРАН ГОРИТ*')
                        : 'НЕТ HTTPS';
  }

  function acquire(){
    if (!want || wl || vid) return;
    if (navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request('screen').then(function(s){
        wl = s; mode = 'wl';
        s.addEventListener('release', function(){ wl = null; status(); });
        status();
      }).catch(function(){ videoFallback(); });
    } else {
      videoFallback();
    }
  }

  // запасной вариант для старых браузеров и http: крошечное зацикленное видео
  function videoFallback(){
    if (vid || !document.createElement('canvas').captureStream) { status(); return; }
    try{
      var c = document.createElement('canvas');
      c.width = c.height = 2;
      var ctx = c.getContext('2d'), t = 0;
      setInterval(function(){ t ^= 1; ctx.fillStyle = t ? '#000' : '#010101'; ctx.fillRect(0,0,2,2); }, 1000);
      var v = document.createElement('video');
      v.srcObject = c.captureStream(1);
      v.muted = true; v.playsInline = true; v.setAttribute('playsinline',''); v.loop = true;
      v.style.cssText = 'position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:.01;pointer-events:none';
      document.body.appendChild(v);
      v.play().then(function(){ vid = v; mode = 'video'; status(); })
              .catch(function(){ status(); });
    }catch(e){ status(); }
  }

  function release(){
    if (wl){ wl.release(); wl = null; }
    if (vid){ vid.pause(); vid.remove(); vid = null; }
    status();
  }

  lockEl.addEventListener('click', function(){
    want = !want;
    if (want) acquire(); else release();
    buzz();
  });

  // блокировка снимается при сворачивании — вернуть при возврате
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') acquire();
  });
  // первое касание по странице — на случай, если браузер требует жеста
  document.addEventListener('pointerdown', function once(){
    acquire();
    document.removeEventListener('pointerdown', once);
  });

  acquire();
  status();
})();
</script>
</body>
</html>
